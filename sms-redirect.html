<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening SMS...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    .emoji {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .manual-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #007AFF;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
    }
    .manual-link:hover {
      background: #0051D5;
    }
  </style>
  <script>
    // Automatically redirect to SMS on page load
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);
      const phone = params.get('phone') || '';
      const body = params.get('body') || '';
      
      // Build SMS URL
      const smsUrl = `sms:${phone}?&body=${encodeURIComponent(body)}`;
      
      // Update manual link
      document.getElementById('manualLink').href = smsUrl;
      
      // Auto-redirect after short delay
      setTimeout(() => {
        window.location.href = smsUrl;
      }, 500);
    };
  </script>
</head>
<body>
  <div class="emoji">📱</div>
  <h1>Opening your messaging app...</h1>
  <p>If nothing happens automatically, click below:</p>
  <a href="#" id="manualLink" class="manual-link">Open Messages</a>
  
  <p style="margin-top: 40px; color: #666; font-size: 14px;">
    LaunchMate SMS Redirect
  </p>
</body>
</html>
